<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Foundry Management System</title>
<style>
:root{--ink:#101b2a;--orange:#ff5908;--blue:#0875c9;--green:#07834d;--red:#e5221b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:linear-gradient(120deg,#22160f,#101b29 55%,#142333)}
.page{width:min(1450px,100%);margin:auto;padding:26px 24px 32px}
header{text-align:center;margin:0 auto 32px}
.gear{width:64px;height:64px;border:3px solid #e1e8ef;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;font-size:39px}
h1{font-size:clamp(27px,4vw,45px);margin:0 0 12px;letter-spacing:-.6px}
.subtitle{display:flex;align-items:center;justify-content:center;gap:14px;color:#d0d9e3;font-size:clamp(11px,1.5vw,16px);font-weight:700;letter-spacing:.25em}
.subtitle:before,.subtitle:after{content:"";width:68px;height:1px;background:#82909e}
.departments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{--accent:var(--orange);min-width:0;overflow:hidden;display:flex;flex-direction:column;background:#f8fafc;color:var(--ink);border:2px solid var(--accent);border-radius:17px;box-shadow:0 12px 32px #0005}
.card.maintenance{--accent:var(--blue)}.card.quality{--accent:var(--green)}.card.heat{--accent:var(--red)}
.photo{height:clamp(145px,20vw,255px);width:100%;display:block;object-fit:cover;background:#253343}
.card-content{display:flex;flex:1;flex-direction:column;align-items:center;text-align:center;padding:0 12px 14px}
.badge-icon{width:76px;height:76px;margin-top:-38px;border:5px solid #f8fafc;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:35px;z-index:1}
h2{font-size:clamp(18px,1.8vw,26px);margin:10px 0 20px}
a{width:100%;margin-top:auto;display:flex;justify-content:center;align-items:center;gap:12px;padding:13px 8px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-size:clamp(13px,1.4vw,17px);font-weight:700}
a:hover{filter:brightness(1.12)}a:focus-visible{outline:3px solid #111827;outline-offset:3px}
.arrow{font-size:23px;line-height:1}
footer{text-align:center;color:#b8c5d3;font-size:12px;margin-top:22px}
@media(max-width:850px){.departments{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:210px}}
@media(max-width:480px){.page{padding:22px 13px}.departments{grid-template-columns:1fr;gap:17px}.card{max-width:390px;width:100%;margin:auto}.photo{height:205px}.subtitle{letter-spacing:.12em;gap:8px}.subtitle:before,.subtitle:after{width:24px}}
</style>
</head>
