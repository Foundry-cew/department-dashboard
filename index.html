<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111827">
<title>Foundry Management System</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#172230;--text:#f8fafc;--muted:#b7c3d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(ellipse at 10% 10%,#66320f 0,transparent 36%),radial-gradient(ellipse at 90% 12%,#153d5a 0,transparent 38%),linear-gradient(145deg,#0c121b,#172433 55%,#101722)}.wrap{max-width:1180px;margin:auto;padding:42px 22px 36px}header{text-align:center;margin-bottom:34px}.logo{width:64px;height:64px;border:3px solid #d8e1eb;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:32px}h1{font-size:clamp(28px,4vw,46px);margin:0 0 12px;letter-spacing:-.6px}.subtitle{font-size:13px;letter-spacing:.28em;color:#c4ced9;font-weight:700}.rule{display:flex;align-items:center;justify-content:center;gap:16px}.rule:before,.rule:after{content:"";height:1px;background:#718096;width:80px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#f8fafc;color:#111827;border-radius:16px;overflow:hidden;border:3px solid var(--accent);box-shadow:0 14px 36px #0005;display:flex;flex-direction:column;min-width:0}.art{height:190px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#182536);position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff45;border-radius:50%;box-shadow:0 0 0 20px #ffffff0b,0 0 0 42px #ffffff0b}.art .symbol{font-size:74px;z-index:1;color:#fff;text-shadow:0 5px 20px #0005}.content{padding:20px 16px 17px;display:flex;flex:1;flex-direction:column;align-items:center;text-align:center}.icon{height:74px;width:74px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-size:34px;margin-top:-55px;border:5px solid #f8fafc;z-index:2}h2{font-size:23px;margin:12px 0 20px}a{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;background:var(--accent);color:white;padding:14px 12px;border-radius:9px;font-weight:700;width:100%;transition:filter .15s,transform .15s}a:hover{filter:brightness(1.12);transform:translateY(-1px)}a:focus-visible{outline:3px solid #111827;outline-offset:3px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:160px}}@media(max-width:500px){.wrap{padding:28px 14px}.grid{grid-template-columns:1fr}.art{height:145px}.card{max-width:400px;width:100%;margin:auto}.subtitle{letter-spacing:.16em}}
</style></head>
<body><main class="wrap"><header><div class="logo" aria-hidden="true">⚙</div><h1>Foundry Management System</h1><div class="rule"><div class="subtitle">DEPARTMENT DASHBOARDS</div></div></header>
<section class="grid" aria-label="Department dashboards">
<article class="card" style="--accent:#f45b0b"><div class="art" aria-hidden="true"><span class="symbol">♨</span></div><div class="content"><div class="icon" aria-hidden="true">▥</div><h2>Foundry</h2><a href="foundry.html">View Dashboard <span aria-hidden="true">›</span></a></div></article>
<article class="card" style="--accent:#0875c9"><div class="art" aria-hidden="true"><span class="symbol">⚙</span></div><div class="content"><div class="icon" aria-hidden="true">⚒</div><h2>Maintenance</h2><a href="maintenance.html">View Dashboard <span aria-hidden="true">›</span></a></div></article>
<article class="card" style="--accent:#07834d"><div class="art" aria-hidden="true"><span class="symbol">⌖</span></div><div class="content"><div class="icon" aria-hidden="true">✓</div><h2>Quality</h2><a href="quality.html">View Dashboard <span aria-hidden="true">›</span></a></div></article>
<article class="card" style="--accent:#e12620"><div class="art" aria-hidden="true"><span class="symbol">♨</span></div><div class="content"><div class="icon" aria-hidden="true">♨</div><h2>Heat Treatment</h2><a href="heat-treatment.html">View Dashboard <span aria-hidden="true">›</span></a></div></article>
</section><footer>Management overview · Select a department to open its dashboard</footer></main></body></html>
