
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101722">
<title>Foundry Management System</title>

<style>
:root {
  --bg: #101722;
  --ink: #101b2a;
  --muted: #d4dce5;
  --orange: #ff5908;
  --blue: #0875c9;
  --green: #07834d;
  --red: #e5221b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(ellipse at 8% 15%, #8a3c12 0, transparent 36%),
    radial-gradient(ellipse at 88% 15%, #173e59 0, transparent 40%),
    linear-gradient(145deg, #0b1018, #172638 60%, #101722);
}
.page {
  width: min(1450px, 100%);
  margin: auto;
  padding: 28px 24px 36px;
}
header {
  text-align: center;
  margin-bottom: 38px;
}
.gear {
  width: 72px;
  height: 72px;
  margin: 0 auto 10px;
  border: 4px solid #e1e8ef;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 43px;
  line-height: 1;
}
h1 {
  margin: 0 0 12px;
  font-size: clamp(27px, 4vw, 48px);
  letter-spacing: -.7px;
}
.subtitle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 17px;
  color: #d0d9e3;
  font-size: clamp(11px, 1.6vw, 17px);
  font-weight: 700;
  letter-spacing: .25em;
}
.subtitle::before, .subtitle::after {
  content: "";
  width: 76px;
  height: 1px;
  background: #82909e;
}
.departments {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}
.card {
  --accent: var(--orange);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 3px solid var(--accent);
  border-radius: 19px;
  background: #f8fafc;
  color: var(--ink);
  box-shadow: 0 12px 32px #0005;
}
.card.maintenance { --accent: var(--blue); }
.card.quality { --accent: var(--green); }
.card.heat { --accent: var(--red); }

.art {
  position: relative;
  height: 220px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent) 85%, white), transparent 52%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 75%, #101722), #142333);
}
.art::before, .art::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  border: 1px solid #ffffff35;
  border-radius: 50%;
}
.art::after { width: 280px; height: 280px; }
.art-icon {
  z-index: 1;
  font-size: 86px;
  color: white;
  text-shadow: 0 4px 20px #0005;
}
.card-content {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 17px;
  text-align: center;
}
.badge-icon {
  display: grid;
  place-items: center;
  width: 88px;
  height: 88px;
  margin-top: -48px;
  border: 6px solid #f8fafc;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 39px;
  z-index: 2;
}
h2 {
  margin: 13px 0 22px;
  font-size: clamp(19px, 2vw, 28px);
}
.card a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  margin-top: auto;
  padding: 15px 10px;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  transition: filter .15s, transform .15s;
}
.card a:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}
.card a:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
}
.arrow { font-size: 24px; line-height: 1; }
footer {
  margin-top: 26px;
  text-align: center;
  color: #b8c5d3;
  font-size: 12px;
}
@media (max-width: 900px) {
  .departments { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .art { height: 180px; }
}
@media (max-width: 480px) {
  .page { padding: 24px 13px; }
  header { margin-bottom: 27px; }
  .departments { grid-template-columns: 1fr; gap: 18px; }
  .card { width: 100%; max-width: 390px; margin: auto; }
  .art { height: 165px; }
  .subtitle { letter-spacing: .12em; gap: 8px; }
  .subtitle::before, .subtitle::after { width: 25px; }
}
</style>
</head>

<body>
<main class="page">

<header>
  <div class="gear" aria-hidden="true">⚙</div>
  <h1>Foundry Management System</h1>
  <div class="subtitle">DEPARTMENT DASHBOARDS</div>
</header>

<section class="departments" aria-label="Department dashboards">

  <article class="card foundry">
    <div class="art" aria-hidden="true">
      <span class="art-icon">♨</span>
    </div>
    <div class="card-content">
      <div class="badge-icon" aria-hidden="true">▥</div>
      <h2>Foundry</h2>
      <a href="foundry.html">
        View Dashboard <span class="arrow">›</span>
      </a>
    </div>
  </article>

  <article class="card maintenance">
    <div class="art" aria-hidden="true">
      <span class="art-icon">⚙</span>
    </div>
    <div class="card-content">
      <div class="badge-icon" aria-hidden="true">⚒</div>
      <h2>Maintenance</h2>
      <a href="maintenance.html">
        View Dashboard <span class="arrow">›</span>
      </a>
    </div>
  </article>

  <article class="card quality">
    <div class="art" aria-hidden="true">
      <span class="art-icon">⌖</span>
    </div>
    <div class="card-content">
      <div class="badge-icon" aria-hidden="true">✓</div>
      <h2>Quality</h2>
      <a href="quality.html">
        View Dashboard <span class="arrow">›</span>
      </a>
    </div>
  </article>

  <article class="card heat">
    <div class="art" aria-hidden="true">
      <span class="art-icon">♨</span>
    </div>
    <div class="card-content">
      <div class="badge-icon" aria-hidden="true">♨</div>
      <h2>Heat Treatment</h2>
      <a href="heat-treatment.html">
        View Dashboard <span class="arrow">›</span>
      </a>
    </div>
  </article>

</section>

<footer>
  Foundry Management System · Department Progress Overview
</footer>

</main>
</body>
</html>
